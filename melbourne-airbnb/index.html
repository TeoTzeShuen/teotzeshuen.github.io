    <script>
      // apply the saved display mode before first paint (the same rules as src/engine/modes.js)
      (function () {
        var h = document.documentElement;
        var q = new URLSearchParams(location.search);
        var get = function (k) {
          try {
            return localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        };
        var th = q.get('theme') || get('melb.theme');
        var pr = get('melb.present') === '1';
        if (q.has('present')) pr = q.get('present') !== '0' && q.get('present') !== 'false';
        h.dataset.theme = th === 'light' ? 'light' : 'dark';
        if (pr) h.classList.add('present');
      })();
    </script>

    <!-- desktop-only notice: shown on phones, tablets and portrait windows; dismissable for the session -->
    <div id="desk-warn" role="alertdialog" aria-modal="true" aria-labelledby="dw-h" aria-describedby="dw-p" hidden>
      <div class="dw-card">
        <p class="dw-eyebrow">DESKTOP ONLY</p>
        <h2 id="dw-h">Best on a big screen.</h2>
        <p id="dw-p">This site is built for a desktop or laptop in landscape, with a keyboard or mouse. On a phone, a tablet or a tall window, the charts and labels won't fit.</p>
        <button type="button" class="dw-btn" data-interactive>Continue anyway</button>
      </div>
    </div>
    <style>#desk-warn{z-index:10000;color:#e9e4d8;background:#060a14fb;justify-content:center;align-items:center;padding:24px;font-family:IBM Plex Sans,system-ui,sans-serif;display:flex;position:fixed;inset:0}#desk-warn[hidden]{display:none}#desk-warn .dw-card{max-width:420px}#desk-warn .dw-eyebrow{letter-spacing:.16em;color:#f0a04b;margin:0 0 14px;font:500 12px/1 IBM Plex Mono,ui-monospace,monospace}#desk-warn h2{margin:0 0 14px;font:400 32px/1.1 Fraunces Variable,Georgia,serif}#desk-warn p{color:#b9b6ae;margin:0 0 24px;font-size:16px;line-height:1.6}#desk-warn .dw-btn{color:#f0a04b;letter-spacing:.08em;cursor:pointer;background:0 0;border:1px solid;border-radius:2px;padding:10px 16px;font:500 13px/1 IBM Plex Mono,ui-monospace,monospace}html[data-theme=light] #desk-warn{color:#1b2030;background:#f3efe6fb}html[data-theme=light] #desk-warn p{color:#5d6577}html[data-theme=light] #desk-warn .dw-eyebrow,html[data-theme=light] #desk-warn .dw-btn{color:#9c4a0e}</style>
    <script>
      (function () {
        var el = document.getElementById('desk-warn');
        var KEY = 'melb.deskOk';
        var ok = function () {
          try { return sessionStorage.getItem(KEY) === '1'; } catch (e) { return false; }
        };
        // "seems mobile": a portrait window, a narrow one, or a touch-only device (no fine pointer that can hover)
        var check = function () {
          var portrait = window.innerHeight > window.innerWidth;
          var narrow = window.innerWidth < 900;
          var touchOnly = window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches;
          var show = !ok() && (portrait || narrow || touchOnly);
          var was = !el.hidden;
          el.hidden = !show;
          if (show && !was) el.querySelector('.dw-btn').focus({ preventScroll: true });
          document.documentElement.classList.toggle('desk-warn', show);
        };
        el.querySelector('.dw-btn').addEventListener('click', function () {
          try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
          check();
        });
        // while it shows, keys must not step the page behind it
        var btn = el.querySelector('.dw-btn');
        window.addEventListener('keydown', function (e) {
          if (el.hidden) return;
          var onBtn = e.target === btn && (e.key === 'Enter' || e.key === ' ');
          if (e.key !== 'Tab' && !onBtn) { e.stopImmediatePropagation(); e.preventDefault(); }
        }, true);
        window.addEventListener('resize', check);
        window.addEventListener('orientationchange', check);
        check();
      })();
    </script>

  </body>
