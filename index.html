<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Simple Link Page</title>
		<style>
			:root {
				--bg: #f6f4ef;
				--text: #1b1b1b;
				--accent: #1f4b3f;
				--card: #ffffff;
				--shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				font-family: "Georgia", "Times New Roman", serif;
				color: var(--text);
				background:
					radial-gradient(circle at 10% 10%, #efe8dc 0, transparent 50%),
					radial-gradient(circle at 90% 20%, #e3efe9 0, transparent 45%),
					var(--bg);
			}

			.page {
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 48px 20px;
			}

			.card {
				width: min(900px, 100%);
				background: var(--card);
				border-radius: 20px;
				padding: 40px 32px;
				box-shadow: var(--shadow);
			}

			header {
				display: flex;
				flex-direction: column;
				gap: 8px;
				margin-bottom: 28px;
			}

			h1 {
				margin: 0;
				font-size: 2.2rem;
				letter-spacing: 0.02em;
			}

			p {
				margin: 0;
				opacity: 0.75;
			}

			.links {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
				gap: 16px;
			}

			.link-slot {
				border: 2px dashed #c6c1b7;
				border-radius: 14px;
				padding: 18px;
				min-height: 88px;
				display: grid;
				align-content: center;
				gap: 6px;
			}

			.link-slot a {
				color: var(--accent);
				text-decoration: none;
				font-weight: 700;
			}

			.hint {
				font-size: 0.9rem;
				opacity: 0.6;
			}

			@media (max-width: 600px) {
				.card {
					padding: 28px 20px;
				}
			}
		</style>
	</head>
	<body>
		<main class="page">
			<section class="card">
				<header>
					<h1>Links</h1>
				</header>

				<div class="links">
					<div class="link-slot">
						<a href="https://github.com/TeoTzeShuen/WiZ-Menu-Bar">Wiz Menu Bar</a>
						<div class="hint">Swift Project to control WiZ-Enabled lightbulbs via udp broadcasts</div>
					</div>
					<div class="link-slot">
						<a href="https://github.com/TeoTzeShuen/PodScrolling">PodScrolling</a>
						<div class="hint">Control MacOS scrolling behavior via the Airpods Motion API and acessibility features on MacOS</div>
					</div>
					<div class="link-slot">
						<a href="https://teotzeshuen.github.io/third-space/">Between Us</a>
						<div class="hint">Small HTML virtual project conversion of UDE:2222 physical project</div>
                    </div>
				</div>
			</section>
		</main>
	</body>
</html>
