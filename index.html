<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teo Tze Shuen</title>
  <meta name="description" content="Teo Tze Shuen" />
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet" />
  <script>
    // Apply saved theme before paint to avoid a flash.
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg-from: #ffffff;
      --bg-mid: #fff1ec;
      --bg-to: #fdd6c8;
      --ink: #161616;
      --muted: rgba(22, 22, 22, 0.45);
      /* particle colours: r,g,b */
      --orb-a: 150, 146, 148;
      --orb-b: 236, 140, 120;
      --swarm: 226, 122, 100;
      /* the other theme's gradient, shown by the toggle's peek */
      --alt-from: #07080d;
      --alt-mid: #141020;
      --alt-to: #3a1c2c;
      --alt-ink: #f1e6e1;
      --gutter: clamp(24px, 5.5vw, 64px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-from: #07080d;
        --bg-mid: #141020;
        --bg-to: #3a1c2c;
        --ink: #f1e6e1;
        --muted: rgba(241, 230, 225, 0.45);
        --orb-a: 196, 190, 222;
        --orb-b: 255, 170, 148;
        --swarm: 255, 184, 160;
        --alt-from: #ffffff;
        --alt-mid: #fff1ec;
        --alt-to: #fdd6c8;
        --alt-ink: #161616;
      }
    }

    :root[data-theme="dark"] {
      --bg-from: #07080d;
      --bg-mid: #141020;
      --bg-to: #3a1c2c;
      --ink: #f1e6e1;
      --muted: rgba(241, 230, 225, 0.45);
      --orb-a: 196, 190, 222;
      --orb-b: 255, 170, 148;
      --swarm: 255, 184, 160;
      --alt-from: #ffffff;
      --alt-mid: #fff1ec;
      --alt-to: #fdd6c8;
      --alt-ink: #161616;
    }

    * { box-sizing: border-box; }

    /* Page-flip peek: a straight 45deg fold from the top-right corner.
       The wrapper casts the fold's shadow (filters run before masks, so it can't live on #peek). */
    #peek-wrap {
      position: fixed;
      inset: 0;
      pointer-events: none;
      filter: drop-shadow(-4px 4px 10px rgba(0, 0, 0, 0.22));
      visibility: hidden;
    }
    #peek {
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, var(--alt-from) 0%, var(--alt-mid) 55%, var(--alt-to) 100%);
      --r: 0px;
      --f: 1.5px;
      -webkit-mask-image: linear-gradient(225deg, #000 max(0px, calc(var(--r) - var(--f))), transparent var(--r));
              mask-image: linear-gradient(225deg, #000 max(0px, calc(var(--r) - var(--f))), transparent var(--r));
    }

    html, body { height: 100%; margin: 0; }

    body {
      background: linear-gradient(125deg, var(--bg-from) 0%, var(--bg-mid) 55%, var(--bg-to) 100%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: "Newsreader", Georgia, "Times New Roman", serif;
      overflow: hidden;
      transition: color .6s ease;
    }

    main {
      position: relative;
      height: 100vh;
      height: 100svh;
    }

    .name {
      position: absolute;
      left: var(--gutter);
      bottom: var(--gutter);
      margin: 0;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      line-height: 1.2;
      letter-spacing: 0.005em;
      opacity: 0;
      transform: translateY(6px);
      animation: rise 1.4s cubic-bezier(.2,.7,.2,1) .2s forwards;
    }

    .orb {
      position: absolute;
      right: calc(var(--gutter) - 24px);
      bottom: calc(var(--gutter) - 24px);
      width: clamp(120px, 15vw, 190px);
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      border-radius: 50%;
      opacity: 0;
      animation: fade 1.8s ease .5s forwards;
    }

    .orb:focus-visible { outline: 1px solid var(--muted); outline-offset: 2px; }
    .orb canvas { width: 100%; height: 100%; display: block; }

    .work {
      position: absolute;
      right: var(--gutter);
      bottom: calc(var(--gutter) - 24px + clamp(120px, 15vw, 190px) + 8px);
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      pointer-events: none;
    }

    .work li {
      opacity: 0;
      transform: translateY(14px) scale(.96);
      transform-origin: right bottom;
      transition: opacity .35s ease, transform .5s cubic-bezier(.2,.8,.2,1.2);
      /* closing: top item leaves first */
      transition-delay: calc((var(--n) - 1 - var(--i)) * 40ms);
    }

    .work.open { pointer-events: auto; }
    .work.open li {
      opacity: 1;
      transform: none;
      /* opening: bottom item (nearest the orb) appears first */
      transition-delay: calc((var(--n) - 1 - var(--i)) * 70ms);
    }

    .work a {
      color: var(--ink);
      text-decoration: none;
      font-style: italic;
      font-size: clamp(1.1rem, 1.7vw, 1.35rem);
      line-height: 1.2;
      background-image: linear-gradient(currentColor, currentColor);
      background-size: 0% 1px;
      background-position: right bottom;
      background-repeat: no-repeat;
      transition: background-size .35s ease;
    }
    .work a:hover, .work a:focus-visible { background-size: 100% 1px; outline: none; }

    .theme-toggle {
      position: absolute;
      top: var(--gutter);
      right: var(--gutter);
      padding: 4px 0;
      border: 0;
      background: none;
      color: var(--muted);
      font: italic 400 1rem/1 "Newsreader", Georgia, serif;
      cursor: pointer;
      opacity: 0;
      animation: fade 1.8s ease .9s forwards;
      transition: color .3s ease;
    }
    .theme-toggle:hover, .theme-toggle:focus-visible { color: var(--ink); outline: none; }
    /* once the peek has swallowed the toggle, it takes the other theme's ink */
    .theme-toggle.consumed { color: var(--alt-ink); }

    #swarm {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes fade { to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .name, .orb, .theme-toggle { animation: none; opacity: 1; transform: none; }
      #swarm { display: none; }
    }
  </style>
</head>
<body>
  <div id="peek-wrap" aria-hidden="true"><div id="peek"></div></div>
  <main>
    <button class="theme-toggle" id="theme-toggle" type="button"></button>
    <h1 class="name">Teo Tze Shuen</h1>
    <ul class="work" id="work" style="--n: 2">
      <li style="--i: 0"><a href="https://github.com/TeoTzeShuen" target="_blank" rel="noopener" tabindex="-1">GitHub</a></li>
      <li style="--i: 1"><a href="https://teotzeshuen.github.io/melbourne-airbnb/" tabindex="-1">Melbourne</a></li>
    </ul>
    <button class="orb" id="orb" type="button" aria-label="View my work" aria-expanded="false" aria-controls="work">
      <canvas id="orb-canvas"></canvas>
    </button>
  </main>
  <canvas id="swarm" aria-hidden="true"></canvas>

  <script>
  (() => {
    const root = document.documentElement;
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const darkQuery = matchMedia('(prefers-color-scheme: dark)');

    // ---------- Theme ----------
    const toggle = document.getElementById('theme-toggle');
    const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : darkQuery.matches;
    let colors = {};
    const readColors = () => {
      const cs = getComputedStyle(root);
      const rgb = n => cs.getPropertyValue(n).split(',').map(Number);
      colors = { a: rgb('--orb-a'), b: rgb('--orb-b'), swarm: rgb('--swarm'), dark: isDark() };
      toggle.textContent = colors.dark ? 'light' : 'dark';
      toggle.setAttribute('aria-label', 'Switch to ' + toggle.textContent + ' mode');
    };
    const switchTheme = () => {
      root.dataset.theme = isDark() ? 'light' : 'dark';
      try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
      readColors();
    };

    // Peek: hovering the toggle lets the other theme seep in from the top-right corner;
    // clicking floods the rest of the page, then the theme actually switches.
    const peek = document.getElementById('peek');
    let peekR = 0, peekTarget = 0, peekMode = 'idle', peekArmed = true; // idle | hover | fill
    const peekWrap = document.getElementById('peek-wrap');
    // Distances run along the 225deg gradient line: a point a px from the right and b px from the top
    // sits (a + b) / sqrt(2) from the corner. diag() is the full length of that line.
    const diag = () => (innerWidth + innerHeight) / Math.SQRT2;
    const feather = () => 1.5;
    const toggleDist = () => {
      const b = toggle.getBoundingClientRect();
      return (innerWidth - b.left + b.bottom) / Math.SQRT2; // farthest point of the text from the corner
    };

    toggle.addEventListener('pointerenter', e => {
      if (e.pointerType === 'touch' || !peekArmed || peekMode === 'fill' || reduceMotion) return;
      peekMode = 'hover';
      // a small glow, just big enough to swallow the toggle text
      peekTarget = Math.max(diag() * 0.1, toggleDist() * 1.25);
    });
    toggle.addEventListener('pointerleave', () => {
      peekArmed = true;
      if (peekMode === 'hover') { peekMode = 'idle'; peekTarget = 0; }
    });
    toggle.addEventListener('click', () => {
      if (reduceMotion) { switchTheme(); return; }
      if (peekMode === 'fill') return;
      peekMode = 'fill';
      peekArmed = false; // don't start peeking the old theme while still hovering
      peekTarget = diag() + feather() + 80;
    });

    const stepPeek = () => {
      const f = feather();
      const k = peekMode === 'fill' ? 0.14 : peekMode === 'hover' ? 0.035 : 0.07;
      peekR += (peekTarget - peekR) * k;
      if (peekMode === 'fill' && peekR >= diag() + f) {
        switchTheme();          // page underneath now matches what the peek showed
        peekMode = 'idle';
        peekR = peekTarget = 0;
      }
      // the mask fades linearly to 0 at r, so the text is well covered once r is ~1.3x its distance
      toggle.classList.toggle('consumed', peekMode !== 'idle' && peekR > toggleDist() + 4);
      if (peekR < 0.5) { peekWrap.style.visibility = 'hidden'; return; }
      peekWrap.style.visibility = 'visible';
      peek.style.setProperty('--r', peekR.toFixed(1) + 'px');
      peek.style.setProperty('--f', f.toFixed(1) + 'px');
    };
    darkQuery.addEventListener('change', readColors);
    readColors();

    // ---------- Particle orb ----------
    const orbBtn = document.getElementById('orb');
    const orbCanvas = document.getElementById('orb-canvas');
    const octx = orbCanvas.getContext('2d');

    let seed = 11;
    const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    // Fibonacci sphere with a little radial scatter so it reads as a cloud, not a grid.
    const N = 520;
    const golden = Math.PI * (3 - Math.sqrt(5));
    const pts = [];
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2;
      const rr = Math.sqrt(1 - y * y);
      const th = i * golden;
      const r = 1 + (rand() - 0.5) * 0.12;
      pts.push({
        x: Math.cos(th) * rr * r, y: y * r, z: Math.sin(th) * rr * r,
        s: 0.6 + rand() * 0.8,        // size factor
        ph: rand() * Math.PI * 2       // twinkle phase
      });
    }

    let dpr = 1, ow = 0;
    const sizeOrb = () => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      ow = Math.round(orbCanvas.clientWidth * dpr);
      orbCanvas.width = orbCanvas.height = ow;
    };
    sizeOrb();
    new ResizeObserver(sizeOrb).observe(orbCanvas);

    const tilt = 0.38, cosT = Math.cos(tilt), sinT = Math.sin(tilt);
    let angle = 0.6, boost = 0, spread = 1, spreadTarget = 1, hover = 0;
    orbBtn.addEventListener('pointerenter', () => { hover = 1; });
    orbBtn.addEventListener('pointerleave', () => { hover = 0; });

    function drawOrb(time) {
      octx.clearRect(0, 0, ow, ow);
      const ca = Math.cos(angle), sa = Math.sin(angle);
      const R = ow * 0.36 * spread;
      const c = ow / 2;
      const { a, b, dark } = colors;
      octx.globalCompositeOperation = dark ? 'lighter' : 'source-over';

      for (const p of pts) {
        // spin around Y, tilt around Z
        const x0 = p.x * ca + p.z * sa;
        const z = -p.x * sa + p.z * ca;
        const x = x0 * cosT - p.y * sinT;
        const y = x0 * sinT + p.y * cosT;

        const depth = (z + 1) / 2;                  // 0 back .. 1 front
        const warm = Math.max(0, (x - y) * 0.5 + 0.35); // warmer toward bottom-right
        const mix = Math.min(1, warm);
        const col = a.map((v, i) => Math.round(v + (b[i] - v) * mix));
        const tw = 0.85 + 0.15 * Math.sin(time * 0.002 + p.ph);
        const alpha = (0.18 + depth * 0.72) * tw;
        const size = (0.7 + depth * 1.3) * p.s * dpr * (ow / (150 * dpr)) ;

        octx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha.toFixed(3)})`;
        octx.beginPath();
        octx.arc(c + x * R, c - y * R, Math.max(0.5, size), 0, Math.PI * 2);
        octx.fill();
      }
      octx.globalCompositeOperation = 'source-over';
    }

    // Orb toggles the stacked list of work above it.
    const work = document.getElementById('work');
    const links = work.querySelectorAll('a');
    let open = false, spin = 0.004;
    const setOpen = state => {
      open = state;
      work.classList.toggle('open', open);
      orbBtn.setAttribute('aria-expanded', open);
      links.forEach(a => a.tabIndex = open ? 0 : -1);
      if (reduceMotion) { angle += 0.3; drawOrb(0); }
    };
    orbBtn.addEventListener('click', () => setOpen(!open));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) { setOpen(false); orbBtn.focus(); } });
    document.addEventListener('click', e => {
      if (open && !orbBtn.contains(e.target) && !work.contains(e.target)) setOpen(false);
    });

    // ---------- Cursor swarm ----------
    const sw = document.getElementById('swarm');
    const sctx = sw.getContext('2d');
    let sdpr = 1;
    const sizeSwarm = () => {
      sdpr = Math.min(window.devicePixelRatio || 1, 2);
      sw.width = Math.round(innerWidth * sdpr);
      sw.height = Math.round(innerHeight * sdpr);
    };
    sizeSwarm();
    addEventListener('resize', sizeSwarm);

    const mouse = { x: innerWidth * 0.5, y: innerHeight * 0.5, active: false, lastMove: 0, speed: 0 };
    let presence = 0; // fades the swarm in/out
    addEventListener('pointermove', e => {
      if (e.pointerType === 'touch') return;
      const dx = e.clientX - mouse.x, dy = e.clientY - mouse.y;
      mouse.speed = Math.min(60, Math.hypot(dx, dy));
      mouse.x = e.clientX; mouse.y = e.clientY;
      if (!mouse.active) swarm.forEach(p => { p.x = mouse.x; p.y = mouse.y; });
      mouse.active = true;
      mouse.lastMove = performance.now();
    });
    document.addEventListener('pointerleave', () => { mouse.active = false; });
    addEventListener('blur', () => { mouse.active = false; });

    const SWARM_N = matchMedia('(pointer: fine)').matches ? 40 : 0;
    const swarm = Array.from({ length: SWARM_N }, () => ({
      x: mouse.x, y: mouse.y, vx: 0, vy: 0,
      orbit: 8 + Math.random() * 22,
      ang: Math.random() * Math.PI * 2,
      spin: (Math.random() < 0.5 ? -1 : 1) * (0.003 + Math.random() * 0.008),
      k: 0.006 + Math.random() * 0.012,    // spring stiffness: low = lazy trailers
      damp: 0.8 + Math.random() * 0.06,    // heavier damping = no overshoot/whipping
      size: 0.5 + Math.random() * 1,
      wob: Math.random() * Math.PI * 2
    }));

    function drawSwarm(time) {
      presence += ((mouse.active ? 1 : 0) - presence) * 0.04;
      mouse.speed *= 0.9;
      sctx.setTransform(1, 0, 0, 1, 0, 0);
      sctx.clearRect(0, 0, sw.width, sw.height);
      if (presence < 0.01) return;

      const idle = Math.min(1, (performance.now() - mouse.lastMove) / 1500);
      const { swarm: col, dark } = colors;
      sctx.globalCompositeOperation = dark ? 'lighter' : 'source-over';
      sctx.setTransform(sdpr, 0, 0, sdpr, 0, 0);

      for (const p of swarm) {
        p.ang += p.spin * (1 + idle * 0.4);
        p.wob += 0.008;
        // orbit loosens when the cursor rests, tightens into a stream when it moves
        const radius = p.orbit * (0.6 + idle * 0.4 + Math.sin(p.wob) * 0.1) + mouse.speed * 0.08;
        const tx = mouse.x + Math.cos(p.ang) * radius;
        const ty = mouse.y + Math.sin(p.ang) * radius;
        p.vx = (p.vx + (tx - p.x) * p.k) * p.damp;
        p.vy = (p.vy + (ty - p.y) * p.k) * p.damp;
        p.x += p.vx; p.y += p.vy;

        const v = Math.min(1, Math.hypot(p.vx, p.vy) / 20);
        const alpha = (dark ? 0.45 : 0.6) * presence * (0.75 + v * 0.25);
        sctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha.toFixed(3)})`;
        sctx.beginPath();
        sctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        sctx.fill();
      }
      sctx.globalCompositeOperation = 'source-over';
    }

    // ---------- Loop ----------
    function loop(time) {
      boost *= 0.96;
      spreadTarget = 1 + hover * 0.06;
      spread += (spreadTarget - spread) * 0.06;
      spin += ((open ? 0.009 : 0.004) - spin) * 0.04; // ease into a slightly faster spin while open
      angle += spin + boost;
      stepPeek();
      drawOrb(time);
      if (SWARM_N) drawSwarm(time);
      requestAnimationFrame(loop);
    }

    if (reduceMotion) drawOrb(0);
    else requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
